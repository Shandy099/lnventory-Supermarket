<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Sistem Inventory & POS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card login-card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="login-logo"><i class="bi bi-box-seam-fill"></i></div>
            <h4 class="fw-bold mb-0">Sistem Inventory &amp; POS</h4>
            <p class="text-muted small mt-1">Masuk untuk melanjutkan</p>
          </div>

          <div id="alertLogin" class="alert alert-danger d-none align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="alertMsg">Username atau password salah.</span>
          </div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="inputUsername" class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" id="inputUsername" class="form-control" placeholder="Masukkan username" autocomplete="username" required />
              </div>
            </div>
            <div class="mb-4">
              <label for="inputPassword" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" id="inputPassword" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" title="Tampilkan/sembunyikan password" aria-label="Tampilkan atau sembunyikan password"><i class="bi bi-eye-fill" id="eyeIcon"></i></button>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg fw-semibold" id="btnLogin">
                <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                <i class="bi bi-box-arrow-in-right me-1" id="loginIcon"></i>Masuk
              </button>
            </div>
          </form>

          <div class="account-hint mt-4">
            <p class="fw-semibold mb-2 text-secondary"><i class="bi bi-info-circle me-1"></i>Akun Demo:</p>
            <div class="d-flex flex-column gap-2 small">
              <div><span class="badge bg-danger">Admin</span> <code class="ms-1">admin</code> / <code>admin123</code></div>
              <div><span class="badge bg-warning text-dark">Gudang</span> <code class="ms-1">gudang</code> / <code>gudang123</code></div>
              <div><span class="badge bg-success">Kasir</span> <code class="ms-1">kasir</code> / <code>kasir123</code></div>
            </div>
          </div>
        </div>
        <p class="text-center text-white-50 small mt-3">&copy; 2026 Proyek RPL &mdash; Kelompok 5</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();
    document.getElementById("togglePassword").addEventListener("click", function () {
      const input = document.getElementById("inputPassword");
      const icon = document.getElementById("eyeIcon");
      input.type = input.type === "password" ? "text" : "password";
      icon.className = input.type === "password" ? "bi bi-eye-fill" : "bi bi-eye-slash-fill";
    });
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("inputUsername").value.trim();
      const password = document.getElementById("inputPassword").value;
      const alertBox = document.getElementById("alertLogin");
      const alertMsg = document.getElementById("alertMsg");
      const spinner = document.getElementById("loginSpinner");
      const btnLogin = document.getElementById("btnLogin");
      const loginIcon = document.getElementById("loginIcon");
      if (!username || !password) {
        alertMsg.textContent = "Username dan password wajib diisi.";
        alertBox.classList.remove("d-none"); alertBox.classList.add("d-flex"); return;
      }
      btnLogin.disabled = true; spinner.classList.remove("d-none"); loginIcon.classList.add("d-none");
      alertBox.classList.add("d-none");
      window.setTimeout(() => {
        const result = doLogin(username, password);
        if (result.success) {
          window.location.href = ROLE_PERMISSIONS[result.user.role].redirectTo;
        } else {
          alertMsg.textContent = result.message;
          alertBox.classList.remove("d-none"); alertBox.classList.add("d-flex");
          btnLogin.disabled = false; spinner.classList.add("d-none"); loginIcon.classList.remove("d-none");
          document.getElementById("inputPassword").value = "";
          document.getElementById("inputUsername").focus();
        }
      }, 350);
    });
  </script>
</body>
</html>
